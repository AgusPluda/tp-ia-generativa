# Batería de evaluación: 26 preguntas. El test tests/unit/test_eval_battery.py la mantiene en
# sincronía con specs/001-agente-sql-rag-gimnasio/contracts/eval-battery.md (mismos IDs, texto y tipo).
# Las consultas doradas devuelven solo las columnas que deben aparecer en la respuesta. Placeholders:
# {{REFERENCE_DATE}}, {{INICIO_ULTIMO_MES}} y {{DIAS_CINTAS}} (los reemplaza eval/battery.py).

# --- Solo SQL (7) -----------------------------------------------------------------------------
- id: S01
  tipo: sql
  pregunta: "¿Cuántos socios tiene cada plan?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT p.nombre, COUNT(s.id_socio)
        FROM planes p LEFT JOIN socios s ON s.id_plan = p.id_plan
        GROUP BY p.id_plan, p.nombre ORDER BY p.nombre

- id: S02
  tipo: sql
  pregunta: "¿Qué instructor tuvo más asistencias en el último mes?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT i.nombre, i.apellido, COUNT(*)
        FROM asistencias a
        JOIN clases c ON c.id_clase = a.id_clase
        JOIN instructores i ON i.id_instructor = c.id_instructor
        WHERE a.presente = true
          AND a.fecha BETWEEN DATE '{{INICIO_ULTIMO_MES}}' AND DATE '{{REFERENCE_DATE}}'
        GROUP BY i.id_instructor, i.nombre, i.apellido
        ORDER BY COUNT(*) DESC LIMIT 1

- id: S03
  tipo: sql
  pregunta: "¿Qué socios tienen pagos vencidos?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT DISTINCT s.nombre, s.apellido
        FROM socios s JOIN pagos p ON p.id_socio = s.id_socio
        WHERE p.estado = 'vencido' ORDER BY s.apellido, s.nombre

- id: S04
  tipo: sql
  pregunta: "How many active members do we have?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: "SELECT COUNT(*) FROM socios WHERE estado = 'activo'"
    - tipo: idioma
      idioma: en

- id: S05
  tipo: sql
  pregunta: "¿Cuánto se recaudó en el último mes?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT SUM(monto) FROM pagos
        WHERE estado = 'pagado'
          AND fecha_pago BETWEEN DATE '{{INICIO_ULTIMO_MES}}' AND DATE '{{REFERENCE_DATE}}'

- id: S06
  tipo: sql
  pregunta: "¿Cuántas clases dicta cada instructor?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT i.nombre, i.apellido, COUNT(c.id_clase)
        FROM instructores i LEFT JOIN clases c ON c.id_instructor = i.id_instructor
        GROUP BY i.id_instructor, i.nombre, i.apellido ORDER BY i.apellido, i.nombre

- id: S07
  tipo: sql
  pregunta: "¿Cuántos equipos están fuera de servicio?"
  fuentes_esperadas: [sql]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: "SELECT COUNT(*) FROM equipamiento WHERE estado = 'fuera_de_servicio'"

