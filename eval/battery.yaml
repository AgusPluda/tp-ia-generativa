# --- Híbridas (4) -----------------------------------------------------------------------------
- id: H01
  tipo: hibrida
  pregunta: "¿Qué socios no asistieron el último mes y qué dice el reglamento sobre el congelamiento?"
  fuentes_esperadas: [ambas]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT DISTINCT s.nombre, s.apellido
        FROM socios s JOIN asistencias a ON a.id_socio = s.id_socio
        WHERE a.presente = false
          AND a.fecha BETWEEN DATE '{{INICIO_ULTIMO_MES}}' AND DATE '{{REFERENCE_DATE}}'
        ORDER BY s.apellido, s.nombre
    - { tipo: contiene_hecho, hecho: congelamiento_max_dias }
    - { tipo: documento_citado, documento: "Reglamento interno" }

- id: H02
  tipo: hibrida
  pregunta: "¿Qué equipos están en mantenimiento y cada cuánto se revisan según el manual?"
  fuentes_esperadas: [ambas]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: "SELECT nombre FROM equipamiento WHERE estado = 'en_mantenimiento' ORDER BY nombre"
    - { tipo: contiene_hecho, hecho: frecuencia_mantenimiento_cintas }
    - { tipo: contiene_hecho, hecho: frecuencia_mantenimiento_bicicletas }
    - { tipo: contiene_hecho, hecho: frecuencia_mantenimiento_maquinas_pesas }
    - { tipo: documento_citado, documento: "Manual de uso y mantenimiento del equipamiento" }

- id: H03
  tipo: hibrida
  pregunta: "¿Qué socios tienen pagos vencidos y qué dice el reglamento sobre la mora?"
  fuentes_esperadas: [ambas]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT DISTINCT s.nombre, s.apellido
        FROM socios s JOIN pagos p ON p.id_socio = s.id_socio
        WHERE p.estado = 'vencido' ORDER BY s.apellido, s.nombre
    - { tipo: contiene_hecho, hecho: mora_dias_para_vencido }
    - { tipo: documento_citado, documento: "Reglamento interno" }

- id: H04
  tipo: hibrida
  pregunta: "¿Qué cintas llevan sin mantenimiento más tiempo del que indica el manual?"
  fuentes_esperadas: [ambas]
  chequeos:
    - tipo: contiene_valores_de_sql
      sql: >-
        SELECT nombre FROM equipamiento
        WHERE tipo = 'Cinta de correr'
          AND ultimo_mantenimiento < DATE '{{REFERENCE_DATE}}' - {{DIAS_CINTAS}}
        ORDER BY nombre
    - { tipo: contiene_hecho, hecho: frecuencia_mantenimiento_cintas }
    - { tipo: documento_citado, documento: "Manual de uso y mantenimiento del equipamiento" }

