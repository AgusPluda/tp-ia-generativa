services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AGENTE_RO_PASSWORD: ${AGENTE_RO_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de este directorio se ejecutan SOLO la primera vez que se crea el volumen.
      # Para reiniciar la base desde cero: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante la init el servidor temporal solo escucha por socket Unix; con TCP
      # el contenedor pasa a healthy recién cuando arranca el servidor definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Observabilidad opcional (alternativa open source a LangSmith).
  # Se levanta con: docker compose --profile observability up -d
  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    container_name: gym_phoenix
    profiles: ["observability"]
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OTLP gRPC

volumes:
  pgdata:
