[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-agent"
version = "0.1.0"
description = "Agente conversacional SQL + RAG para gimnasio"
requires-python = ">=3.12,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
